{% extends "procedures/procedimento_base.html" %}

{% block title %}Detalhe do Procedimento{% endblock %}
{% block header_title %}{{ proc.codigo }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h5>{{ proc.nome }}</h5>
    </div>
    <div class="card-body">
        <p><strong>Código:</strong> {{ proc.codigo }}</p>
        <p><strong>Descrição:</strong></p>
        <p>{{ proc.descricao|linebreaks }}</p>
    </div>
</div>
{% endblock %}
