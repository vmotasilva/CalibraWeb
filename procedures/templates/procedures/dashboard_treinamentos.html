{% extends "base.html" %}
{% load static %}

{% block title %}Dashboard de Treinamentos{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div id="mainContent">
        <!-- Cards e gráficos removidos -->
    </div>
</div>

<!-- Chart.js para gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    let chartStatus, chartMeses;

    // Função para atualizar gráficos
    function updateCharts(data) {
        // Atualizar KPIs
        document.getElementById('totalTreinamentos').textContent = data.total_treinamentos;
        document.getElementById('treinamentosVigentes').textContent = data.treinamentos_vigentes;
        document.getElementById('treinamentosPendentes').textContent = data.treinamentos_pendentes;
        document.getElementById('treinamentos30Dias').textContent = data.treinamentos_ultimos_30_dias;
        document.getElementById('taxaConformidade').textContent = data.taxa_conformidade + '% de conformidade';
        document.getElementById('progressConformidade').style.width = data.taxa_conformidade + '%';

        // Atualizar gráfico de status
        if (chartStatus) {
            chartStatus.data.datasets[0].data = [data.status_distribuicao.vigente, data.status_distribuicao.pendente];
            chartStatus.update();
        }

        // Atualizar gráfico de meses
        if (chartMeses) {
            const meses = data.treinamentos_por_mes.map(item => item.mes);
            const valores = data.treinamentos_por_mes.map(item => item.total);
            chartMeses.data.labels = meses;
            chartMeses.data.datasets[0].data = valores;
            chartMeses.update();
        }

        // Atualizar top procedimentos
        let htmlProc = '';
        if (data.top_procedimentos && data.top_procedimentos.length > 0) {
            htmlProc = '<div style="max-height: 400px; overflow-y: auto;"><table class="table table-sm table-hover mb-0"><thead class="table-light"><tr><th>Código</th><th>Nome</th><th class="text-end">Treinamentos</th></tr></thead><tbody>';
            data.top_procedimentos.forEach(proc => {
                htmlProc += `<tr><td><span class="badge bg-primary">${proc.procedimento__codigo}</span></td><td><small>${proc.procedimento__nome.split(' ').slice(0,5).join(' ')}</small></td><td class="text-end"><strong>${proc.total}</strong><span class="ms-2"><div class="progress" style="width: 50px; height: 4px; display: inline-block;"><div class="progress-bar bg-info" style="width: ${Math.min(proc.total * 5, 100)}%"></div></div></span></td></tr>`;
            });
            htmlProc += '</tbody></table></div>';
        } else {
            htmlProc = '<p class="text-muted text-center">Nenhum procedimento com treinamentos completos</p>';
        }
        document.getElementById('topProcedimentos').innerHTML = htmlProc;

        // Atualizar top colaboradores
        let htmlColab = '';
        if (data.top_colaboradores && data.top_colaboradores.length > 0) {
            htmlColab = '<div style="max-height: 400px; overflow-y: auto;"><table class="table table-sm table-hover mb-0"><thead class="table-light"><tr><th>Colaborador</th><th class="text-end">Treinamentos</th></tr></thead><tbody>';
            data.top_colaboradores.forEach(colab => {
                htmlColab += `<tr><td><small>${colab.colaborador__nome_completo}</small></td><td class="text-end"><strong>${colab.total}</strong><span class="ms-2"><span class="badge bg-success">${colab.total}</span></span></td></tr>`;
            });
            htmlColab += '</tbody></table></div>';
        } else {
            htmlColab = '<p class="text-muted text-center">Nenhum colaborador com treinamentos completos</p>';
        }
        document.getElementById('topColaboradores').innerHTML = htmlColab;
    }

    // Inicializar gráficos
    const ctxStatus = document.getElementById('chartStatus').getContext('2d');
    chartStatus = new Chart(ctxStatus, {
        type: 'doughnut',
        data: {
            labels: ['Vigentes', 'Pendentes'],
            datasets: [{
                data: [{{ status_distribuicao.vigente }}, {{ status_distribuicao.pendente }}],
                backgroundColor: ['#28a745', '#ffc107'],
                borderColor: ['#218838', '#e0a800'],
                borderWidth: 2,
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        padding: 15,
                        font: {
                            size: 14
                        }
                    }
                }
            }
        }
    });

    // Gráfico de Treinamentos por Mês
    const meses = [
        {% for item in treinamentos_por_mes %}
        '{{ item.mes }}'{{ forloop.last|yesno:'' }},
        {% endfor %}
    ];

    const valores = [
        {% for item in treinamentos_por_mes %}
        {{ item.total }}{{ forloop.last|yesno:'' }},
        {% endfor %}
    ];

    const ctxMeses = document.getElementById('chartMeses').getContext('2d');
    chartMeses = new Chart(ctxMeses, {
        type: 'bar',
        data: {
            labels: meses,
            datasets: [{
                label: 'Treinamentos Realizados',
                data: valores,
                backgroundColor: 'rgba(23, 162, 184, 0.6)',
                borderColor: 'rgba(23, 162, 184, 1)',
                borderWidth: 2,
                borderRadius: 4,
                hoverBackgroundColor: 'rgba(23, 162, 184, 0.8)'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            indexAxis: 'x',
            plugins: {
                legend: {
                    display: true,
                    labels: {
                        padding: 15,
                        font: {
                            size: 13
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            }
        }
    });

    // Aplicar filtros
    document.getElementById('applyFilters').addEventListener('click', function() {
        const formData = new FormData(document.getElementById('filterForm'));
        const params = new URLSearchParams();
        for (let [key, value] of formData.entries()) {
            if (value) params.append(key, value);
        }

        fetch(`{% url 'training:dashboard_filtered' %}?${params}`)
            .then(response => response.json())
            .then(data => {
                updateCharts(data);
            })
            .catch(error => console.error('Erro ao aplicar filtros:', error));
    });

    // Limpar filtros
    document.getElementById('clearFilters').addEventListener('click', function() {
        document.getElementById('filterForm').reset();
        location.reload(); // Recarregar para dados originais
    });

    // Toggle sidebar
    document.getElementById('toggleSidebar').addEventListener('click', function() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const icon = this.querySelector('i');
        sidebar.classList.toggle('collapsed');
        mainContent.classList.toggle('collapsed');
        if (sidebar.classList.contains('collapsed')) {
            icon.classList.remove('bi-funnel');
            icon.classList.add('bi-chevron-right');
        } else {
            icon.classList.remove('bi-chevron-right');
            icon.classList.add('bi-funnel');
        }
    });

    // Toggle chevron icon for KPIs
    document.querySelector('[data-bs-target="#kpiCollapse"]').addEventListener('click', function() {
        const icon = this.querySelector('i');
        if (icon.classList.contains('bi-chevron-down')) {
            icon.classList.remove('bi-chevron-down');
            icon.classList.add('bi-chevron-up');
        } else {
            icon.classList.remove('bi-chevron-up');
            icon.classList.add('bi-chevron-down');
        }
    });
});
</script>

<style>
    .card {
        border-radius: 0.5rem;
        border: 1px solid #dee2e6;
        transition: box-shadow 0.3s ease;
    }

    .card:hover {
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
    }

    .badge {
        font-weight: 500;
        padding: 0.5rem 0.75rem;
    }

    .progress {
        background-color: #e9ecef;
        border-radius: 0.25rem;
    }

    .table-hover tbody tr:hover {
        background-color: #f8f9fa;
    }

    .sticky-top {
        z-index: 1020;
    }

    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 300px;
        height: 100vh;
        z-index: 1000;
        transition: left 0.3s ease;
        background-color: #f8f9fa;
        padding: 1rem;
        overflow-y: auto;
    }

    .sidebar.collapsed {
        left: -300px;
    }

    #mainContent {
        margin-left: 300px;
        transition: margin-left 0.3s ease;
    }

    #mainContent.collapsed {
        margin-left: 0;
    }
</style>
{% endblock %}
