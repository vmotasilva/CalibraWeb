<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Calibra QMS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #071526 0%, #0a2540 50%, #0d3356 100%);
            color: #e8f4ff;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 18px 12px;
        }

        .auth-card {
            background-color: #0b2a3a;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 520px;
            border: 1px solid rgba(78, 168, 255, 0.2);
            margin-top: 28px;
        }

        .form-control {
            background-color: #0f3447;
            border: 1px solid rgba(78, 168, 255, 0.3);
            color: white;
            padding: 12px 14px;
        }

        .form-control:focus {
            background-color: #0f3447;
            color: white;
            box-shadow: 0 0 10px rgba(78, 168, 255, 0.3);
            border-color: #4ea8ff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2d6a4f 0%, #40916c 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
        }

        .form-label {
            color: #a0c4e8;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .alert { border: none; border-radius: 10px; }
        .alert-danger { background-color: rgba(220, 53, 69, 0.2); color: #ff6b6b; }
        .alert-info { background-color: rgba(78, 168, 255, 0.15); color: #a0c4e8; }
        .alert-warning { background-color: rgba(255, 193, 7, 0.15); color: #ffc107; }

        a { color: #4ea8ff; text-decoration: none; }
        a:hover { color: #7ec8ff; text-decoration: underline; }

        .text-primary { color: #4ea8ff !important; }
        .text-muted { color: rgba(255, 255, 255, 0.5) !important; }

        /* Evita zoom no iOS e melhora legibilidade */
        input, select, textarea { font-size: 16px; }
        .btn { min-height: 40px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="auth-card">
        {% block auth_content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
