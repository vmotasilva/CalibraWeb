# ════════════════════════════════════════════════════════════════
# NGINX CACHE CONFIGURATION
# ════════════════════════════════════════════════════════════════
#
# Nginx reverse proxy with HTTP caching layer
# Alternative to Varnish, simpler and less memory-intensive
#
# Installation:
# 1. Install nginx: sudo apt-get install nginx
# 2. Place this file at: /etc/nginx/conf.d/cache.conf
# 3. Reload: sudo systemctl reload nginx
#
# Performance:
# - Nginx cache: 1-10ms (SSD) to 5-50ms (disk)
# - Memory efficiency: 10-100MB vs Varnish 100MB-1GB
# - CPU efficiency: Lower overhead than Varnish
#
# Author: Caching Team
# Date: 2025-12
# ════════════════════════════════════════════════════════════════

# ════════════════════════════════════════════════════════════════
# CACHE PATH DEFINITION
# ════════════════════════════════════════════════════════════════

# Main cache zone (for dynamic content)
proxy_cache_path /var/cache/nginx/main
    levels=1:2
    keys_zone=main_cache:10m
    max_size=1g
    inactive=60m
    use_temp_path=off;

# Static assets cache (long-lived)
proxy_cache_path /var/cache/nginx/static
    levels=1:2
    keys_zone=static_cache:50m
    max_size=5g
    inactive=365d
    use_temp_path=off;

# API cache (short-lived)
proxy_cache_path /var/cache/nginx/api
    levels=1:2
    keys_zone=api_cache:5m
    max_size=500m
    inactive=10m
    use_temp_path=off;

# ════════════════════════════════════════════════════════════════
# UPSTREAM BACKENDS
# ════════════════════════════════════════════════════════════════

upstream django_backend {
    least_conn;  # Load balancing algorithm

    # Main Django server
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;

    # Backup servers (optional)
    server 127.0.0.1:8001 backup;
    server 127.0.0.1:8002 backup;

    # Health checks (requires http_upstream_module)
    keepalive 32;
}

# ════════════════════════════════════════════════════════════════
# HTTP CACHE CONFIGURATION
# ════════════════════════════════════════════════════════════════

# Cache key definition (what makes cache entries unique)
map $scheme$host$request_uri$request_body $cache_key {
    default "$scheme$http_host$request_uri$http_authorization";
}

# Cache control logic
map $request_method $cache_method {
    GET 1;
    HEAD 1;
    default 0;
}

# Vary by Accept-Encoding
map $http_accept_encoding $cache_encoding {
    default "";
    ~*gzip "$http_accept_encoding";
    ~*deflate "$http_accept_encoding";
}

# ════════════════════════════════════════════════════════════════
# MAIN SERVER BLOCK
# ════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    # ────────────────────────────────────────────────────────────
    # LOGGING
    # ────────────────────────────────────────────────────────────

    access_log /var/log/nginx/cache_access.log;
    error_log /var/log/nginx/cache_error.log;

    # ────────────────────────────────────────────────────────────
    # STATIC ASSETS (Long cache)
    # ────────────────────────────────────────────────────────────

    location ~ \.(css|js|gif|jpg|jpeg|png|ico|svg|woff|woff2)(\?[a-z0-9]+)?$ {
        proxy_pass http://django_backend;

        # Cache for 1 year (versioned assets)
        proxy_cache static_cache;
        proxy_cache_valid 200 365d;
        proxy_cache_valid 404 1d;
        proxy_cache_bypass $http_pragma $http_authorization;

        # Add cache status header
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Compression
        proxy_set_header Accept-Encoding gzip;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_vary on;
        gzip_comp_level 6;
    }

    # ────────────────────────────────────────────────────────────
    # API ENDPOINTS (Short cache)
    # ────────────────────────────────────────────────────────────

    location ~ ^/api/v[0-9]+/ {
        proxy_pass http://django_backend;

        # Only cache successful GET requests
        proxy_cache api_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 304 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_bypass $http_pragma $http_authorization $request_method;

        # Don't cache if Authorization header present
        proxy_cache_bypass $http_authorization;

        # Cache key includes authorization
        proxy_cache_key "$scheme$host$request_uri$http_authorization";

        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=300, vary=Accept-Encoding";

        # Default headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ────────────────────────────────────────────────────────────
    # HTML PAGES (Medium cache with validation)
    # ────────────────────────────────────────────────────────────

    location ~ \.(html|htm)$ {
        proxy_pass http://django_backend;

        proxy_cache main_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 10m;

        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=3600, must-revalidate";

        # Support conditional requests (304)
        proxy_cache_revalidate on;
        proxy_cache_min_uses 2;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ────────────────────────────────────────────────────────────
    # DEFAULT DYNAMIC CONTENT (Smart cache)
    # ────────────────────────────────────────────────────────────

    location / {
        proxy_pass http://django_backend;

        # ──────────────────────────────────────────────────────
        # CACHE CONFIGURATION
        # ──────────────────────────────────────────────────────

        # Only cache GET/HEAD requests
        proxy_cache main_cache;
        proxy_cache_methods GET HEAD;

        # Cache valid responses for 10 minutes
        proxy_cache_valid 200 10m;

        # Cache 404 for 5 minutes
        proxy_cache_valid 404 5m;

        # Cache 500+ errors for 1 minute (serve stale)
        proxy_cache_valid 500 502 503 504 1m;

        # Bypass cache for these conditions
        proxy_cache_bypass $http_pragma $http_authorization;

        # Never cache if Authorization header present
        proxy_cache_bypass $http_authorization;

        # Don't cache POST requests
        proxy_cache_bypass $request_method;

        # ──────────────────────────────────────────────────────
        # CACHE KEY
        # ──────────────────────────────────────────────────────

        # Include query string in cache key
        proxy_cache_key "$scheme$host$request_uri$is_args$args$http_authorization";

        # ──────────────────────────────────────────────────────
        # CACHE STATUS HEADERS
        # ──────────────────────────────────────────────────────

        # Show cache hit/miss status
        add_header X-Cache $upstream_cache_status always;

        # Show cache age
        add_header Cache-Age $upstream_cache_status always;

        # ──────────────────────────────────────────────────────
        # REVALIDATION
        # ──────────────────────────────────────────────────────

        # Revalidate cache entries with backend
        proxy_cache_revalidate on;

        # Don't use stale cache while backend is down
        proxy_cache_use_stale error timeout invalid_header updating;

        # ──────────────────────────────────────────────────────
        # PROXY HEADERS
        # ──────────────────────────────────────────────────────

        # Pass through original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through cookies (but selectively cache)
        proxy_set_header Cookie $http_cookie;

        # Connection settings
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Don't close connections to backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # ──────────────────────────────────────────────────────
        # COMPRESSION
        # ──────────────────────────────────────────────────────

        # Client → Nginx compression
        gzip on;
        gzip_types text/plain text/css text/javascript application/json;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_min_length 1000;
    }

    # ────────────────────────────────────────────────────────────
    # CACHE CONTROL ENDPOINTS
    # ────────────────────────────────────────────────────────────

    # Purge cache by URL
    location ~ ^/cache/purge/(.*)$ {
        proxy_cache_purge main_cache $scheme$host/$1$is_args$args;
    }

    # View cache statistics
    location /cache/stats {
        access_log off;
        default_type text/plain;
        return 200 "Cache statistics endpoint\n";
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://django_backend;
        proxy_cache off;
    }

    # ────────────────────────────────────────────────────────────
    # DENY SENSITIVE PATHS
    # ────────────────────────────────────────────────────────────

    # Never cache admin
    location ~ ^/admin/ {
        proxy_pass http://django_backend;
        proxy_cache off;
    }

    # Never cache auth
    location ~ ^/(login|logout|register|password)/ {
        proxy_pass http://django_backend;
        proxy_cache off;
    }
}

# ════════════════════════════════════════════════════════════════
# MONITORING AND DEBUG
# ════════════════════════════════════════════════════════════════
#
# Commands:
#
# 1. Check cache size:
#    du -sh /var/cache/nginx/*
#
# 2. Monitor cache hits/misses:
#    tail -f /var/log/nginx/cache_access.log | grep 'X-Cache'
#
# 3. Clear all cache:
#    rm -rf /var/cache/nginx/*
#
# 4. Test cache:
#    curl -I http://localhost/page.html
#    # Look for: X-Cache: HIT or MISS
#
# 5. View Nginx cache stats (with ngx_cache_purge module):
#    curl http://localhost/cache/purge/
#
# ════════════════════════════════════════════════════════════════
#
# PERFORMANCE TUNING:
#
# 1. Increase cache memory:
#    keys_zone=main_cache:100m  # Increased from 10m
#
# 2. Increase cache size:
#    max_size=5g  # Increased from 1g
#
# 3. Longer inactive timeout:
#    inactive=120m  # Increased from 60m
#
# 4. Gzip compression level:
#    gzip_comp_level 9  # Slower, better compression
#
# 5. Buffer sizes:
#    proxy_buffer_size 128k;
#    proxy_buffers 4 256k;
#
# ════════════════════════════════════════════════════════════════
