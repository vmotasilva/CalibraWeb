;; PgBouncer Configuration File
;; Connection pooling configuration for PostgreSQL
;; Production-ready settings optimized for Django applications
;;
;; To run: pgbouncer -d pgbouncer.ini
;; Monitor: psql -p 6432 -U pgbouncer -d pgbouncer -c "SHOW STATS"

[databases]
;; Format: db_name = host=localhost port=5432 user=postgres password=secret
;; In production, load these from environment variables for security
;;
;; Example:
;; calibra_db = host=%[PGHOST] port=%[PGPORT] user=%[PGUSER] password=%[PGPASSWORD] dbname=%[PGDATABASE]
;;
;; For now, use placeholder - replace with actual connection string in production
calibra_db = host=localhost port=5432 user=postgres password=postgres dbname=calibra

[pgbouncer]
;; IP address and port where pgbouncer listens
listen_addr = 127.0.0.1
listen_port = 6432

;; Authentication method
;; userlist.txt format: "username" "password"
auth_file = /etc/pgbouncer/userlist.txt
auth_type = trust

;; Database for maintenance queries (usually postgres)
admin_users = postgres

;; Connection pool settings
;; ─────────────────────────────

;; Pool mode determines how pgbouncer manages connections
;; session:   One client connection per server connection (DEFAULT)
;; transaction: Connection returned to pool after each transaction
;; statement:  Connection returned after each statement (rarely used)
;;
;; For Django with ATOMIC_REQUESTS=True: use 'session' mode
;; For Django with AutoCommit: use 'transaction' mode (better connection utilization)
pool_mode = session

;; Minimum number of server connections in each pool
;; Django default: 1 (increase for better performance under load)
min_pool_size = 5

;; Maximum number of server connections in each pool
;; Formula: (max_pool_size * num_databases * num_users) should <= PostgreSQL max_connections
;; PostgreSQL default max_connections = 100
;; For Django with 8 workers: (15 * 1 * 1) = 15 total connections
max_pool_size = 15

;; Maximum number of queued client connections
;; When exceeded, new client connections are denied with error
max_client_conn = 1000

;; Number of extra connections to open to backend
;; Useful when max_pool_size is reached
reserve_pool_size = 5

;; Time in seconds for idle client connections to disconnect
;; Default: 600 (10 minutes)
;; If client is idle longer than this, it's disconnected
client_idle_timeout = 900

;; Time in seconds for idle server connections to disconnect
;; Saves database resources by closing unused connections
;; Default: 600 (10 minutes)
server_idle_timeout = 300

;; Maximum time in seconds for a server connection to be in use
;; After this, connection is forcefully closed
;; Prevents connection leaks and memory issues
;; Default: 3600 (1 hour)
server_lifetime = 3600

;; Maximum time in seconds for a server connection that is in an
;; idle transaction state (BEGIN without COMMIT/ROLLBACK)
;; Prevents long-running implicit transactions from blocking other queries
;; Recommended: 60-300 seconds for web applications
;; Default: 0 (disabled)
idle_in_transaction_session_timeout = 300

;; Maximum time in seconds to wait for a connection to become available
;; If exceeded, pgbouncer returns an error
;; Default: 30
;; Prevent: connection pool exhaustion scenarios
connect_timeout = 30

;; TCP keepalive settings (in seconds)
;; Detects dead connections proactively
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

;; Enable TCP keepalives at OS level
tcp_user_timeout = 120

;; Application name for connection tracking
application_name = pgbouncer

;; Logging and monitoring
;; ──────────────────────

;; Verbosity level: fatal, error, warning, info, debug
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

;; Log file path (use - for stdout)
logfile = /var/log/pgbouncer/pgbouncer.log

;; PID file
pidfile = /var/run/pgbouncer.pid

;; Statistics and monitoring
;; ─────────────────────────

;; Enable PgBouncer console (accessible via "psql -p 6432 pgbouncer")
;; Commands: SHOW STATS, SHOW POOLS, SHOW DATABASES, RELOAD, SHUTDOWN
console_login = pgbouncer

;; Statistics reporting interval (seconds)
;; Interval between internal statistics reset
;; 0 = disabled
stats_period = 60

;; Connection performance settings
;; ──────────────────────────────

;; DNS cache timeout (seconds)
dns_max_ttl = 15
dns_nxdomain_ttl = 15

;; Maximum query time allowed before timeout (milliseconds)
;; 0 = disabled (pgbouncer doesn't kill queries)
;; Recommended for Django: 0 (Django handles timeouts)
query_wait_timeout = 0

;; Connection backend timeout (seconds)
;; Time to wait for establishing connection to backend
server_connect_timeout = 15

;; Disable nagle's algorithm for low-latency connections
disable_pqexec = 0

;; Advanced settings
;; ────────────────

;; Maximum STARTUP parameters to accept per connection
;; Prevents resource exhaustion
max_startup_params = 20

;; Hash function for connection tracking
;; Values: lookup3, crc32
hash_function = lookup3

;; Enable automatic parameter tracking
;; Some client libraries set parameters that should be preserved per connection
;;
;; Track custom parameter changes:
;; - search_path: automatically saved per connection (useful for Django)
;; - work_mem: per-connection setting
;; Default: empty (disabled)
variables_in = bytea
variables_out = bytea

;; Version compatibility
;; Server and client protocol compatibility settings
default_pool_size = 25

;; Failover/High Availability
;; ───────────────────────────

;; Connection string for replica/failover servers
;; Format: "host1:port1 host2:port2"
;; Not used with single server config (primary only)
;; failover_hosts = 

;; Load balancing mode (requires multiple hosts in failover_hosts)
;; Can be: RANDOM, LEAST_CONNECTED, ROUND_ROBIN
;; load_balance_mode = LEAST_CONNECTED

;; Pool behavior on error
;; ─────────────────────

;; How long to wait before attempting to reconnect to a failed backend
;; Default: 15 seconds
reconnect_failed_servers = 30

;; Suspend all operations when connection pool is exhausted
;; If enabled: new clients are queued (wait for connection)
;; If disabled: new clients get "too many connections" error
;; Recommended: 1 (enabled) for web apps to handle graceful degradation
;; Default: 0
pause_mode = 1

;; Custom query to test connection health
;; Empty = use simple SELECT 1
;; Example: server_check_query = SELECT 1
;; Default: (empty)
server_check_query = SELECT 1

;; How often to check server health (seconds)
;; 0 = disabled
server_check_delay = 10

;; SSL/TLS Configuration (optional)
;; ────────────────────────────────

;; Enable SSL connection to backend database
;; Values: disable, allow, prefer, require
;; require: force SSL and validate certificate
sslmode = prefer

;; SSL certificate file path
;; sslcert = /path/to/pgbouncer.crt

;; SSL key file path
;; sslkey = /path/to/pgbouncer.key

;; SSL CA certificate file path for validating server
;; sslrootcert = /path/to/ca.crt

;; Replication/Streaming settings (advanced)
;; ──────────────────────────────────────────

;; Allow streaming replication connections
;; Default: 0 (disabled)
allow_streaming = 0

;; Advanced authentication
;; ──────────────────────

;; SCRAM authentication (for PostgreSQL 10+)
;; scram_iterations = 16384

;; MD5 password support (deprecated, but may be needed for older servers)
;; md5_user_tokens = 0

;; Server-side transaction isolation level override (rare)
;; transaction_isolation = read_committed

;; Recommended Django-specific settings summary:
;; ────────────────────────────────────────────
;;
;; pool_mode = session
;; min_pool_size = 5
;; max_pool_size = 15
;; reserve_pool_size = 5
;; server_idle_timeout = 300
;; idle_in_transaction_session_timeout = 300
;; client_idle_timeout = 900
;; connect_timeout = 30
;; server_connect_timeout = 15
;; server_check_delay = 10
;;
;; Monitoring: psql -p 6432 -U pgbouncer -d pgbouncer
;; - SHOW STATS;
;; - SHOW POOLS;
;; - SHOW DATABASES;
;; - RELOAD;
