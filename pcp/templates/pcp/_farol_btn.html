<span class="farol-grupo"><button type="button" class="farol-btn farol-{{ p.estado }}" data-key="{{ p.key }}" data-bs-toggle="modal" data-bs-target="#modal-farol" title="{{ p.rotulo|default:'' }}">{% if p.estado == 'ok' %}✓{% elif p.estado == 'nok' %}✕{% elif p.estado == 'aberto' %}…{% elif p.estado == 'dispensado' %}⚙{% elif p.estado == 'sem' %}–{% elif p.estado == 'info' %}i{% else %}·{% endif %}</button>{% if p.rotulo %}<small>{{ p.rotulo }}</small>{% endif %}</span>
