services:
  # Web Service (Django + Gunicorn)
  - type: web
    name: calibraweb
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: calibraweb-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: calibraweb-redis
          property: connectionString

  # PostgreSQL Database
databases:
  - name: calibraweb-db
    databaseName: calibraweb
    user: calibraweb
    region: oregon
    plan: free
    ipAllowList: []

  # Redis (for Celery - optional)
  - name: calibraweb-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
