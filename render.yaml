services:
  # Web Service (Django + Gunicorn)
  - type: web
    name: calibraweb
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: calibraweb.onrender.com,.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: calibraweb-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: calibraweb-redis
          property: connectionString

  # Redis (for Celery)
  - type: redis
    name: calibraweb-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # PostgreSQL Database
  - name: calibraweb-db
    databaseName: calibraweb
    user: calibraweb
    region: oregon
    plan: free
    ipAllowList: []
