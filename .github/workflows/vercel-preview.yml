name: Vercel Preview Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# DESATIVADO: roda apenas manualmente (workflow_dispatch). Os segredos VERCEL_TOKEN, VERCEL_ORG_ID e
# VERCEL_PROJECT_ID nao estao configurados, o que fazia o job falhar em todo PR. Para reativar, cadastre os
# segredos e restaure o gatilho abaixo:
#   on:
#     pull_request:
#       branches: [main, master]
#       paths-ignore: ['docs/**', '**.md', 'htmlcov/**', '.github/workflows/cobertura-por-app.yml']
on:
  workflow_dispatch:

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
