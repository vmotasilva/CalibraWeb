name: Cobertura por app

# Relatório informativo (não bloqueia o merge): mostra a cobertura de cada app
# no resumo do job, para definir um limite realista por app.
on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  cobertura:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov

    - name: Run pytest com cobertura de todo o repositório
      run: pytest -o addopts="" -q --cov=. --cov-report=xml
      env:
        SECRET_KEY: test-secret-key
        DEBUG: 'True'
        DJANGO_SETTINGS_MODULE: config.settings_test

    - name: Resumo por app
      if: always()
      run: |
        {
          echo "## Cobertura por app"
          python scripts/cobertura_por_app.py coverage.xml
        } | tee -a "$GITHUB_STEP_SUMMARY"
