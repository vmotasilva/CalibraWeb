<div class="accordion-item mb-3 border rounded shadow-sm">
    <h2 class="accordion-header" id="heading-{{ topico.id }}">
        <div class="d-flex align-items-center w-100 bg-light px-3 py-2 rounded-top">
            <button class="accordion-button collapsed flex-grow-1 bg-transparent text-dark border-0 shadow-none fw-bold p-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{{ topico.id }}" aria-expanded="false" aria-controls="collapse-{{ topico.id }}">
                {{ topico.nome }}
            </button>
            
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalAddTopico" data-parent-id="{{ topico.id }}" data-parent-nome="{{ topico.nome }}">
                    <i class="bi bi-plus"></i> Sub-tópico
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#modalEditTopico" data-topico-id="{{ topico.id }}" data-topico-nome="{{ topico.nome }}">
                    <i class="bi bi-pencil"></i>
                </button>
                <form method="post" action="{% url 'auditoria:topico_delete' topico.id %}" style="display: inline;" onsubmit="return confirm('Tem certeza que deseja remover este tópico? Isso removerá a árvore de itens abaixo dele se houver.');">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </div>
        </div>
    </h2>
    <div id="collapse-{{ topico.id }}" class="accordion-collapse collapse" aria-labelledby="heading-{{ topico.id }}">
        <div class="accordion-body p-2">
            {% if topico.subtopicos.all %}
                <div class="accordion ms-4 mt-2">
                    {% for subtopico in topico.subtopicos.all %}
                        {% include 'auditoria/_topico_node.html' with topico=subtopico %}
                    {% endfor %}
                </div>
            {% else %}
                <div class="text-muted small p-2 ms-4">
                    <em>Nenhum sub-tópico cadastrado.</em>
                </div>
            {% endif %}
        </div>
    </div>
</div>
