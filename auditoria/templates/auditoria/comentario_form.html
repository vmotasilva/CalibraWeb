{% extends 'base.html' %}

{% block title %}Editar Comentário - {{ modelo.nome }} - Auditoria{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm p-4">
        <h3>Editar Comentário</h3>
        <p class="text-muted mb-3">{{ modelo.nome }}</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Comentário</label>
                {{ form.texto }}
                {% if form.texto.errors %}
                    <div class="invalid-feedback d-block">{{ form.texto.errors }}</div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{{ back_url }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
