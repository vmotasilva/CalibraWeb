{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm p-4">
        <h3>Excluir Modelo</h3>
        <p>Tem certeza que deseja excluir o modelo <strong>{{ modelo.nome }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Excluir</button>
            <a href="{% url 'auditoria:modelos_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
