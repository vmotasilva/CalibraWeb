<div class="resp-picker" id="{{ prefix }}-resp-picker" data-prefix="{{ prefix }}" data-field="{{ field|default:'responsaveis' }}">
    <div class="d-flex flex-wrap gap-1 mb-1" id="{{ prefix }}-resp-chips"></div>
    <div class="position-relative">
        <input type="text" class="form-control form-control-sm" id="{{ prefix }}-resp-busca" placeholder="{{ placeholder|default:'Digite para buscar colaborador...' }}" autocomplete="off">
        <div class="list-group position-absolute w-100 shadow d-none" id="{{ prefix }}-resp-lista" style="z-index: 1056; max-height: 200px; overflow-y: auto;"></div>
    </div>
    <div id="{{ prefix }}-resp-hidden"></div>
</div>
