{% extends 'base.html' %}

{% block title %}Remover Comentário - {{ modelo.nome }} - Insumos{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm p-4">
        <h3>Remover Comentário</h3>
        <p>Tem certeza que deseja remover este comentário?</p>
        <div class="border rounded p-3 mb-3" style="white-space: pre-wrap;">{{ comentario.texto }}</div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Remover</button>
            <a href="{{ back_url }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
