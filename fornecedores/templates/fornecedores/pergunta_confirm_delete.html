{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Remover Pergunta de Avaliação</h2>
    <div class="alert alert-warning mt-3">
        Tem certeza que deseja remover a pergunta?
        <br>
        <strong>{{ pergunta.texto }}</strong>
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Remover</button>
        <a href="{% url 'fornecedores:pergunta_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
