{% extends 'base.html' %}
{% block content %}
<h3>Novo Documento para {{ fornecedor.empresa }}</h3>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{% url 'fornecedores:fornecedor_detail' fornecedor.pk %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
