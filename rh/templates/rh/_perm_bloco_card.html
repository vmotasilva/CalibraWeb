        <div class="card border mb-2 shadow-none">
            <div class="card-header bg-white block-header collapsed p-0"
                data-bs-toggle="collapse"
                data-bs-target="#collapseSub_{{ modulo_key }}_{{ bloco.key }}"
                aria-expanded="false">
                <div class="d-flex align-items-center justify-content-between px-3 py-2">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-folder2-open text-muted"></i>
                        <strong class="small text-uppercase">{{ bloco.nome }}</strong>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="form-check form-switch mb-0"
                            onclick="event.stopPropagation()">
                            <input type="checkbox" class="form-check-input perm-checkbox"
                                id="perm_{{ bloco.perm.app_label }}_{{ bloco.perm.codename }}"
                                data-codename="{{ bloco.perm.codename }}"
                                data-user-id="{{ usuario.id }}"
                                data-app-label="{{ bloco.perm.app_label }}" {% with perm_key=bloco.perm.full %} {% if perm_key in user_perms or usuario.is_superuser %}checked{% endif %} {% endwith %} {% if usuario.is_superuser or not request.user.is_superuser %}disabled{% endif %}>
                            <label class="form-check-label small"
                                for="perm_{{ bloco.perm.app_label }}_{{ bloco.perm.codename }}">Exibir bloco</label>
                        </div>
                        <i class="bi bi-chevron-down collapse-icon text-muted"></i>
                    </div>
                </div>
            </div>
            <div id="collapseSub_{{ modulo_key }}_{{ bloco.key }}"
                class="collapse">
                <div class="list-group list-group-flush">
                    {% for funcao in bloco.funcoes %}
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="small">{{ funcao.nome }}</div>
                        <div class="form-check form-switch mb-0">
                            <input type="checkbox" class="form-check-input perm-checkbox"
                                id="perm_{{ funcao.perm.app_label }}_{{ funcao.perm.codename }}"
                                data-codename="{{ funcao.perm.codename }}"
                                data-user-id="{{ usuario.id }}"
                                data-app-label="{{ funcao.perm.app_label }}" {% with perm_key=funcao.perm.full %} {% if perm_key in user_perms or usuario.is_superuser %}checked{% endif %} {% endwith %} {% if usuario.is_superuser or not request.user.is_superuser %}disabled{% endif %}>
                            <label class="form-check-label small"
                                for="perm_{{ funcao.perm.app_label }}_{{ funcao.perm.codename }}">Acessar</label>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
