{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Registrar Ocorrência</h2>
    <form method="post" action="{% url 'registrar_ocorrencia' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Colaborador</label>
                {{ form.colaborador }}
            </div>
            <div class="col-md-4">
                <label class="form-label">Data</label>
                {{ form.data_ocorrencia }}
            </div>
            <div class="col-md-4">
                <label class="form-label">Tipo</label>
                {{ form.tipo }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Título</label>
                {{ form.titulo }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Evidência (opcional)</label>
                {{ form.arquivo_evidencia }}
            </div>
            <div class="col-md-12">
                <label class="form-label">Descrição</label>
                {{ form.descricao }}
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Registrar</button>
            <a href="{% url 'modulo_rh' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
