# Railway Configuration for CalibraWeb Services
# Este arquivo documenta como configurar os serviços no Railway

# ============================================================================
# SERVIÇO 1: PostgreSQL Database
# ============================================================================
# Tipo: PostgreSQL
# Imagem: postgres:15
# Variáveis Automáticas:
#   DATABASE_URL (fornecida automaticamente)
#   POSTGRES_URL (fornecida automaticamente pelo Railway)

# ============================================================================
# SERVIÇO 2: Redis Cache & Message Broker
# ============================================================================
# Tipo: Redis
# Imagem: redis:7
# Variáveis Automáticas:
#   REDIS_URL (fornecida automaticamente)

# ============================================================================
# SERVIÇO 3: CalibraWeb Web Application
# ============================================================================
# Nome: calibra-web (ou seu nome preferido)
# Tipo: Docker
# Dockerfile: ./Dockerfile (padrão)
# 
# Configuração Railroad:
#   - GitHub: vmotasilva/CalibraWeb
#   - Branch: main
#   - Dockerfile Path: ./Dockerfile
#   - Port: 8000
#
# Variáveis de Ambiente Necessárias:
#   # Django Core
#   DJANGO_SETTINGS_MODULE=config.settings
#   SECRET_KEY=[GERAR UMA CHAVE SEGURA]
#   DEBUG=False
#   ALLOWED_HOSTS=*
#   
#   # Conectar ao PostgreSQL
#   DATABASE_URL=${{ DATABASE_URL }}  # Copiar do serviço PostgreSQL
#   POSTGRES_URL=${{ POSTGRES_URL }}
#   
#   # Conectar ao Redis
#   REDIS_URL=${{ REDIS_URL }}  # Copiar do serviço Redis
#   CELERY_BROKER_URL=${{ REDIS_URL }}
#   CELERY_RESULT_BACKEND=${{ REDIS_URL }}
#   
#   # Celery Config
#   CELERY_TIMEZONE=America/Sao_Paulo
#   CELERY_ENABLE_UTC=True
#
# Health Check:
#   Path: /healthz
#   Interval: 10s
#   Timeout: 5s
#   Start Period: 5s
#   Success Count: 1

# ============================================================================
# SERVIÇO 4: Celery Beat Scheduler (NOVO)
# ============================================================================
# Nome: celery-beat
# Tipo: Docker
# Dockerfile: ./Dockerfile.beat
# 
# Configuração Railroad:
#   - GitHub: vmotasilva/CalibraWeb
#   - Branch: main
#   - Dockerfile Path: ./Dockerfile.beat
#   - Port: (nenhuma - não é um servidor web)
#
# Variáveis de Ambiente Necessárias:
#   # Django Core
#   DJANGO_SETTINGS_MODULE=config.settings
#   SECRET_KEY=[MESMA DO SERVIÇO WEB]
#   DEBUG=False
#   
#   # Conectar ao PostgreSQL
#   DATABASE_URL=${{ DATABASE_URL }}  # Copiar do serviço PostgreSQL
#   POSTGRES_URL=${{ POSTGRES_URL }}
#   
#   # Conectar ao Redis
#   REDIS_URL=${{ REDIS_URL }}  # Copiar do serviço Redis
#   CELERY_BROKER_URL=${{ REDIS_URL }}
#   CELERY_RESULT_BACKEND=${{ REDIS_URL }}
#   
#   # Celery Config
#   CELERY_TIMEZONE=America/Sao_Paulo
#   CELERY_ENABLE_UTC=True
#
# Health Check: DESATIVADO
#   (Celery Beat não expõe HTTP, não pode fazer health check)
#
# Política de Reinicialização: On Failure
#   Máximo de retries: 5

# ============================================================================
# SERVIÇO 5 (OPCIONAL): Celery Worker
# ============================================================================
# Nome: celery-worker
# Tipo: Docker
# Dockerfile: ./Dockerfile.worker (ainda não criado)
# 
# Para ser criado em um segundo momento
# Será responsável por processar as tarefas agendadas pelo Beat

# ============================================================================
# INSTRUÇÕES PASSO A PASSO
# ============================================================================
#
# PASSO 1: Criar serviços base (se não existirem)
#   1.1. Acesse https://railway.app
#   1.2. Crie um novo projeto ou abra um existente
#   1.3. Clique em "+ Create"
#   1.4. Selecione "PostgreSQL" 
#   1.5. Clique em "+ Create" novamente
#   1.6. Selecione "Redis"
#
# PASSO 2: Criar serviço web (CalibraWeb)
#   2.1. Clique em "+ Create"
#   2.2. Selecione "GitHub"
#   2.3. Autorize o GitHub e selecione "vmotasilva/CalibraWeb"
#   2.4. Selecione "main" como branch
#   2.5. Clique em "Deploy"
#   2.6. Vá para "Settings" → "Dockerfile"
#   2.7. Deixe em branco ou confirm a usar "./Dockerfile"
#   2.8. Vá para "Variables" e adicione as variáveis listadas acima
#   2.9. Clique em "Deploy"
#
# PASSO 3: Criar serviço Celery Beat (NOVO)
#   3.1. No mesmo projeto, clique em "+ Create"
#   3.2. Selecione "GitHub"
#   3.3. Selecione "vmotasilva/CalibraWeb" novamente
#   3.4. Selecione "main" como branch
#   3.5. Nomeie como "celery-beat"
#   3.6. Clique em "Deploy"
#   3.7. Vá para "Settings" → "Dockerfile"
#   3.8. Mude para "./Dockerfile.beat"
#   3.9. Vá para "Variables"
#   3.10. Copie TODAS as variáveis do serviço web
#   3.11. Clique em "Deploy"
#
# PASSO 4: Verificar Deploy
#   4.1. Abra os logs do serviço celery-beat
#   4.2. Procure por "[CELERY_BEAT_ENTRYPOINT]" para confirmar inicialização
#   4.3. Procure por "beat: Entering tick loop" para confirmar agendamento

# ============================================================================
# OBTENDO AS URLS DE CONEXÃO
# ============================================================================
#
# PostgreSQL:
#   1. Clique no serviço "PostgreSQL"
#   2. Vá para "Connect"
#   3. Copie a string de conexão (PostgreSQL)
#   4. Cole em DATABASE_URL e POSTGRES_URL
#
# Redis:
#   1. Clique no serviço "Redis"
#   2. Vá para "Connect"
#   3. Copie a string de conexão (Redis)
#   4. Cole em REDIS_URL, CELERY_BROKER_URL e CELERY_RESULT_BACKEND
#
# Importante: NÃO use template placeholders como ${REDIS_URL}
#             Sempre copie a URL COMPLETA

# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# Problema: Celery Beat não inicia
# Solução:
#   1. Verifique se REDIS_URL está correto (sem template variables)
#   2. Verifique se DATABASE_URL está correto
#   3. Verifique os logs para "ModuleNotFoundError"
#
# Problema: Tarefas não estão sendo executadas
# Solução:
#   1. Confirme que Celery Beat iniciou com sucesso (logs)
#   2. Verifique se há Celery Workers rodando
#   3. Acesse /admin/django_celery_beat/periodictask para ver as tarefas
#
# Problema: "ConnectionError connecting to Redis"
# Solução:
#   1. Confirme que serviço Redis está UP (verde)
#   2. Teste a URL manualmente com redis-cli
#   3. Verifique firewall/network policies
