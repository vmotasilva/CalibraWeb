<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calibra QMS - Validação em Lote</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';</script>
    
    <style>
        /* --- TEMA LIGHT BLUE --- */
        :root {
            --bg-body: #e3f2fd; --bg-sidebar: #ffffff; --text-main: #37474f;
            --text-label: #0277bd; --border-input: #90caf9; --bg-input: #ffffff;
            --accent-color: #0288d1; --success-color: #2e7d32; --warning-bg: #fff3e0;
            --selected-item: #e1f5fe;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; display: flex; gap: 20px; height: 100vh; box-sizing: border-box; }
        .sidebar { background-color: var(--bg-sidebar); padding: 20px; border-radius: 8px; width: 420px; min-width: 420px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-y: auto; border: 1px solid #bbdefb; }
        .preview-area { flex-grow: 1; background-color: #546e7a; border-radius: 8px; display: flex; justify-content: center; overflow: auto; position: relative; padding: 20px; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
        label { font-weight: 600; font-size: 0.85rem; color: var(--text-label); display: block; margin-bottom: 5px; margin-top: 10px; }
        .form-control, .form-select, input[type="text"], input[type="date"], select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-input); background-color: var(--bg-input); color: #333; box-sizing: border-box; transition: 0.2s; }
        .file-item { background: #f9f9f9; padding: 10px; border-radius: 6px; border: 1px solid #eee; border-left: 4px solid #ccc; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .file-item:hover { background-color: #f0f0f0; }
        .file-item.active { background-color: var(--selected-item); border-left-color: var(--accent-color); border: 1px solid var(--accent-color); }
        .file-name { font-size: 0.85rem; font-weight: bold; color: #263238; margin-bottom: 8px; word-break: break-all; display: flex; justify-content: space-between; }
        .status-indicator { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #eee; color: #666; }
        .status-indicator.ok { background: #c8e6c9; color: #2e7d32; }
        #canvas-container { position: relative; border: 1px solid #cfd8dc; box-shadow: 0 5px 15px rgba(0,0,0,0.3); height: fit-content; background-color: white; }
        canvas { display: block; }
        #selection-box { position: absolute; border: 2px solid #d32f2f; background-color: rgba(211, 47, 47, 0.1); display: none; pointer-events: none; }
        .pdf-toolbar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(38, 50, 56, 0.9); padding: 8px 20px; border-radius: 30px; display: flex; gap: 15px; z-index: 100; }
        .btn-icon { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); color: white; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 1.1rem; }
        button.btn-primary { background-color: var(--accent-color); color: white; border: none; padding: 15px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        .btn-back { color: #546e7a; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; margin-bottom: 10px; }
        .btn-replicate { font-size: 0.7rem; padding: 2px 8px; background: #e3f2fd; color: #0277bd; border: 1px solid #bbdefb; border-radius: 4px; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>

    <select id="template-instrument-select" style="display: none;">
        <option value="">-- Selecione a TAG --</option>
        {% for item in instrumentos_data %}
            <option value="{{ item.id }}" data-tol="{{ item.tolerancia|default:'' }}">{{ item.tag }} — {{ item.descricao|truncatechars:30 }}</option>
        {% endfor %}
    </select>

    <div class="sidebar">
        <a href="{% url 'home' %}" class="btn-back"><span>&#8592;</span> Voltar para Dashboard</a>
        <h2 style="margin:0 0 10px 0; color:#0277bd; border-bottom:2px solid #e3f2fd; font-size:1.4rem;">Validação em Lote</h2>
        
        <form method="post" enctype="multipart/form-data" id="stampForm">
            {% csrf_token %}
            <!-- 1. Upload do arquivo PDF -->
            <label>Certificado (PDF):</label> {{ form.arquivo_pdf }}
            <script>
                    // Atualiza o campo Resultado em tempo real
                    function computeResult() {
                        const e = parseFloat(document.getElementById('err-input').value || 'NaN');
                        const u = parseFloat(document.getElementById('inc-input').value || 'NaN');
                        const t = parseFloat(document.getElementById('tol-input').value || 'NaN');
                        const badge = document.getElementById('live-result-text');
                        if(!badge) return;
                        const setBadge = (txt, cls) => { badge.textContent = txt; badge.className = `badge ${cls}`; };
                        if(Number.isNaN(e) || Number.isNaN(u) || Number.isNaN(t)) { setBadge('—', 'bg-secondary'); return; }
                        const ema = Math.abs(t) / 2.0; const eme = Math.abs(e) + Math.abs(u);
                        if(eme <= ema) setBadge('Aprovado sem correções', 'bg-success');
                        else if(eme > ema * 3.0) setBadge('Reprovado', 'bg-danger');
                        else setBadge('Aprovado com correções', 'bg-warning text-dark');
                    }

                    document.addEventListener('DOMContentLoaded', function() {
                        // Listeners para E/U/T
                        const errInput = document.getElementById('err-input');
                        const incInput = document.getElementById('inc-input');
                        const tolInput = document.getElementById('tol-input');
                        if (errInput) errInput.addEventListener('input', computeResult);
                        if (incInput) incInput.addEventListener('input', computeResult);
                        if (tolInput) tolInput.addEventListener('input', computeResult);
                        computeResult(); // inicializa
                    });
            document.addEventListener('DOMContentLoaded', function() {
                var fileInput = document.querySelector('input[type="file"]');
                if (fileInput) fileInput.removeAttribute('multiple');
            });
            </script>
            <div id="file-list-container" style="margin-top: 15px;"></div>
            <!-- Campos SEMPRE visíveis -->
            <div id="static-fields-container">
                <div class="item-row">
                    <span class="item-label">Código do Instrumento:</span>
                    <select id="instrument-select" name="instrument_id" class="form-select" required>
                        <option value="">Selecione...</option>
                        {% for item in instrumentos_data %}
                        <option value="{{ item.id }}" data-tol="{{ item.tolerancia|default:'' }}">{{ item.tag }} — {{ item.descricao|truncatechars:30 }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="item-row">
                    <span class="item-label" style="color: #e65100;">Data Calibração:</span>
                    <input type="date" name="calib_date" id="date-input" required class="form-control" style="padding:5px;">
                </div>
                <div class="item-row">
                    <span class="item-label">Data de Validação:</span>
                    <input type="date" name="data_validacao" id="data-validacao-input" required class="form-control" style="padding:5px;">
                </div>
                <div class="item-row" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; align-items:end;">
                    <div>
                        <span class="item-label">Erro (E)</span>
                        <input type="number" step="0.0001" name="err" id="err-input" class="form-control" placeholder="0.0000">
                    </div>
                    <div>
                        <span class="item-label">Incerteza (U)</span>
                        <input type="number" step="0.0001" name="inc" id="inc-input" class="form-control" placeholder="0.0000">
                    </div>
                    <div>
                        <span class="item-label">Tolerância (+/−)</span>
                        <input type="number" step="0.0001" name="tol" id="tol-input" class="form-control" placeholder="0.0000">
                    </div>
                </div>
                <div class="item-row">
                    <span class="item-label">N° Certificado:</span>
                    <input type="text" name="cert_num" id="cert-num-input" required class="form-control" style="padding:5px;">
                </div>
                <div class="item-row">
                    <span class="item-label">Resultado:</span>
                    <span id="live-result-text" class="badge bg-secondary">—</span>
                </div>
                <div class="item-row">
                    <span class="item-label">Responsável Técnico:</span>
                    {% if is_superuser %}
                        <input type="text" name="responsavel_tecnico" class="form-control" value="{{ user_full_name }}" style="background-color: #fffde7; border-color: #ffe082; color: #0277bd; font-weight: bold;">
                    {% else %}
                        <input type="text" name="responsavel_tecnico" class="form-control" value="{{ user_full_name }}" readonly style="background-color: #e8f5e9; border-color: #a5d6a7; color: #2e7d32; font-weight: bold;">
                    {% endif %}
                </div>
            </div>
            <input type="hidden" name="page_0" id="page-index-hidden" value="0">
            <button type="submit" class="btn-primary">PROCESSAR</button>
        </form>

        <script>
        // Preenchimento automático dos campos
        document.addEventListener('DOMContentLoaded', function() {
            // Instrumento pelo parâmetro da URL
            const urlParams = new URLSearchParams(window.location.search);
            const instrumentId = urlParams.get('instrument_id');
            const instrumentSelect = document.getElementById('instrument-select');
            if (instrumentId && instrumentSelect) {
                for (let i = 0; i < instrumentSelect.options.length; i++) {
                    if (instrumentSelect.options[i].value == instrumentId) {
                        instrumentSelect.selectedIndex = i;
                        // Preenche tolerância se disponível
                        const tol = instrumentSelect.options[i].getAttribute('data-tol');
                        if (tol) document.getElementById('tol-input').value = tol;
                        break;
                    }
                }
            }
            // Data de validação = hoje
            const dataValInput = document.getElementById('data-validacao-input');
            if (dataValInput) {
                const today = new Date().toISOString().split('T')[0];
                dataValInput.value = today;
            }
            // Sugestão para nome do certificado ao selecionar arquivo
            const fileInput = document.querySelector('input[type="file"]');
            const certNumInput = document.getElementById('cert-num-input');
            if (fileInput && certNumInput) {
                fileInput.addEventListener('change', function(e) {
                    if (fileInput.files.length > 0) {
                        const name = fileInput.files[0].name.replace('.pdf', '').substring(0, 30);
                        certNumInput.value = name;
                    }
                });
            }
        });
        </script>
        </form>
    </div>

    <div class="preview-area">
        <div class="pdf-toolbar">
            <button type="button" class="btn-icon" onclick="rotatePDF(-90)">↺</button>
            <button type="button" class="btn-icon" onclick="rotatePDF(90)">↻</button>
        </div>
        <div id="canvas-container">
            <canvas id="pdf-render"></canvas>
            <div id="selection-box"></div>
        </div>
    </div>

    <script>

        // Limpa todas as posições de carimbo
        function clearAllStamps() {
            filesData.forEach((data, idx) => {
                data.x = 0; data.y = 0; data.w = 0; data.h = 0;
                if(document.getElementById(`input-x-${idx}`)) document.getElementById(`input-x-${idx}`).value = '';
                if(document.getElementById(`input-y-${idx}`)) document.getElementById(`input-y-${idx}`).value = '';
                if(document.getElementById(`input-w-${idx}`)) document.getElementById(`input-w-${idx}`).value = '';
                if(document.getElementById(`input-h-${idx}`)) document.getElementById(`input-h-${idx}`).value = '';
                const ind = document.getElementById(`status-${idx}`);
                if(ind) { ind.innerText = "Sem Posição"; ind.classList.remove('ok'); }
            });
            selectionBox.style.display = 'none';
            if (pdfDoc && pageNum) {
                renderPage(pageNum);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        let pdfDoc = null; let pageNum = 1; let scale = 1.2; let rotation = 0; 
        let currentFileIndex = -1; let filesData = [];
        const canvas = document.getElementById('pdf-render');
        const selectionBox = document.getElementById('selection-box');
        const container = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        const globalPW = document.querySelector('input[name="page_width"]');
        const globalPH = document.querySelector('input[name="page_height"]');


        function handleFileSelect(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;
            // Sugere nome do certificado
            const file = files[0];
            const certNumInput = document.getElementById('cert-num-input');
            if (certNumInput) {
                const name = file.name.replace('.pdf', '').substring(0, 30);
                certNumInput.value = name;
            }
            // Carrega preview do PDF
            if (file.type === "application/pdf") {
                const reader = new FileReader();
                reader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                        pdfDoc = pdf; rotation = 0; pageNum = 1; renderPage(pageNum);
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function attachFileInputListener() {
            var fileInputs = document.querySelectorAll('input[type="file"]');
            if (fileInputs.length === 0) {
                console.log('[carimbo] Nenhum input type=file encontrado');
            }
            fileInputs.forEach(function(fileInput) {
                fileInput.removeAttribute('multiple');
                fileInput.removeEventListener('change', handleFileSelect);
                fileInput.addEventListener('change', handleFileSelect);
                fileInput.style.border = '2px solid #1976d2';
                fileInput.style.background = '#e3f2fd';
                console.log('[carimbo] Listener anexado a', fileInput);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            attachFileInputListener();
            // Observa mudanças no DOM para reanexar listener se o campo for recriado
            const observer = new MutationObserver(function(mutations) {
                for (const mutation of mutations) {
                    if (mutation.type === 'childList') {
                        attachFileInputListener();
                    }
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
        });

        function loadFilePreview(index) {
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.file-item[data-index="${index}"]`);
            if(activeItem) activeItem.classList.add('active');
            currentFileIndex = index;
            const file = filesData[index].file;
            if (file.type === "application/pdf") {
                const reader = new FileReader();
                reader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                        pdfDoc = pdf; rotation = 0; pageNum = 1; renderPage(pageNum);
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function renderPage(num) {
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: scale, rotation: rotation % 360 });
                canvas.height = viewport.height; canvas.width = viewport.width;
                if(globalPW) globalPW.value = viewport.width;
                if(globalPH) globalPH.value = viewport.height;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => { drawSavedBox(); drawStampPreview(); });
                const pageHidden = document.getElementById('page-index-hidden');
                if(pageHidden) pageHidden.value = (num - 1);
            });
        }

        // Simple page navigation
        const toolbar = document.querySelector('.pdf-toolbar');
        const prevBtn = document.createElement('button'); prevBtn.type='button'; prevBtn.className='btn-icon'; prevBtn.innerText='◀';
        const nextBtn = document.createElement('button'); nextBtn.type='button'; nextBtn.className='btn-icon'; nextBtn.innerText='▶';
        prevBtn.onclick = () => { if(pdfDoc && pageNum > 1){ pageNum -= 1; renderPage(pageNum);} };
        nextBtn.onclick = () => { if(pdfDoc && pageNum < pdfDoc.numPages){ pageNum += 1; renderPage(pageNum);} };
        toolbar.insertBefore(prevBtn, toolbar.firstChild);
        toolbar.appendChild(nextBtn);

        function drawSavedBox() {
            if(currentFileIndex === -1) return;
            const data = filesData[currentFileIndex];
            if (data.w > 0 && data.h > 0) {
                selectionBox.style.left = data.x + 'px'; selectionBox.style.top = data.y + 'px';
                selectionBox.style.width = data.w + 'px'; selectionBox.style.height = data.h + 'px';
                selectionBox.style.display = 'block';
            } else { selectionBox.style.display = 'none'; }
        }


        // Funções de replicação removidas para evitar redundância e simplificar o fluxo

        window.rotatePDF = function(deg) { if(!pdfDoc) return; rotation += deg; renderPage(pageNum); }

        let isDragging = false; let startX, startY;
        container.addEventListener('mousedown', (e) => {
            if(currentFileIndex === -1) return;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left; startY = e.clientY - rect.top;
            isDragging = true; selectionBox.style.display = 'block';
            selectionBox.style.width = '0px'; selectionBox.style.height = '0px';
            selectionBox.style.left = startX + 'px'; selectionBox.style.top = startY + 'px';
        });
        container.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left; const currentY = e.clientY - rect.top;
            const width = currentX - startX; const height = currentY - startY;
            selectionBox.style.width = Math.abs(width) + 'px'; selectionBox.style.height = Math.abs(height) + 'px';
            selectionBox.style.left = (width < 0 ? currentX : startX) + 'px';
            selectionBox.style.top = (height < 0 ? currentY : startY) + 'px';
        });
        container.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            const rect = selectionBox.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            const x = rect.left - canvasRect.left; const y = rect.top - canvasRect.top;
            filesData[currentFileIndex].x = x; filesData[currentFileIndex].y = y;
            filesData[currentFileIndex].w = rect.width; filesData[currentFileIndex].h = rect.height;
            document.getElementById(`input-x-${currentFileIndex}`).value = x;
            document.getElementById(`input-y-${currentFileIndex}`).value = y;
            document.getElementById(`input-w-${currentFileIndex}`).value = rect.width;
            document.getElementById(`input-h-${currentFileIndex}`).value = rect.height;
            const ind = document.getElementById(`status-${currentFileIndex}`);
            if(ind) { ind.innerText = "Posição OK"; ind.classList.add('ok'); }
            drawStampPreview();
        });

        function drawStampPreview(){
            // Draw a lightweight text preview inside selection box
            if(selectionBox.style.display !== 'block') return;
            const rect = selectionBox.getBoundingClientRect();
            const r = canvas.getBoundingClientRect();
            const lx = rect.left - r.left; const ly = rect.top - r.top;
            const lw = rect.width; const lh = rect.height;
            // Overlay text
            ctx.save();
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = '#2e7d32';
            ctx.font = 'bold 14px Segoe UI';
            const statusSelect = document.querySelector('select[name="status_validacao"]');
            const statusText = statusSelect ? statusSelect.options[statusSelect.selectedIndex].text : 'APROVADO';
            ctx.fillText(statusText, lx + 6, ly + 18);
            ctx.fillStyle = '#000';
            const dateInput = document.querySelector('input[name="data_validacao"]');
            const dv = dateInput ? dateInput.value : '';
            ctx.font = '12px Segoe UI';
            ctx.fillText(dv || '', lx + 6, ly + 34);
            // Busca o valor do campo responsavel_tecnico (editável ou readonly)
            const respInput = document.querySelector('input[name="responsavel_tecnico"]');
            const respValue = respInput ? respInput.value : '';
            ctx.fillText('RESP.: ' + respValue, lx + 6, ly + 50);
            ctx.restore();
        }

        // Live result preview for E/U/T
        function computeResultFor(index){
            const e = parseFloat(document.getElementById(`err-input-${index}`).value || 'NaN');
            const u = parseFloat(document.getElementById(`inc-input-${index}`).value || 'NaN');
            const t = parseFloat(document.getElementById(`tol-input-${index}`).value || 'NaN');
            const badge = document.getElementById(`live-result-text-${index}`);
            if(!badge) return;
            const setBadge = (txt, cls) => { badge.textContent = txt; badge.className = `badge ${cls}`; };
            if(Number.isNaN(e) || Number.isNaN(u) || Number.isNaN(t)) { setBadge('—', 'bg-secondary'); return; }
            const ema = Math.abs(t) / 2.0; const eme = Math.abs(e) + Math.abs(u);
            if(eme <= ema) setBadge('Aprovado sem correções', 'bg-success');
            else if(eme > ema * 3.0) setBadge('Reprovado', 'bg-danger');
            else setBadge('Aprovado com correções', 'bg-warning text-dark');
        }
    </script>
</body>
</html>
