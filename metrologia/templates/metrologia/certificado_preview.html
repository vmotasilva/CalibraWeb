{% extends 'base.html' %}
{% block content %}
<h2>Pré-visualização do Certificado</h2>
<p>Instrumento: {{ historico.instrumento.tag }} - {{ historico.instrumento.descricao }}</p>
<div style="height:70vh; border:1px solid #ddd;">
  {% if historico.certificado %}
    <iframe src="{{ historico.certificado.url }}" width="100%" height="100%"></iframe>
  {% else %}
    <p>Nenhum certificado anexado.</p>
  {% endif %}
</div>
<div class="mt-3">
  <a class="btn btn-danger" href="{% url 'aplicar_carimbo_certificado' historico.id %}">Aplicar carimbo e validar</a>
  <a class="btn btn-secondary" href="{% url 'detalhe_instrumento' historico.instrumento.id %}">Voltar</a>
</div>
{% endblock %}
