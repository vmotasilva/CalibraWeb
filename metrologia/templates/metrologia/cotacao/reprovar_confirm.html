{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="alert alert-warning">
        <h4>Reprovar Cotação #{{ cotacao.id }}</h4>
        <p>Fornecedor: <strong>{{ cotacao.fornecedor.empresa }}</strong></p>
    </div>

    <form method="post" class="mt-4">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="motivo_reprovacao" class="form-label">Motivo da Reprovação</label>
            <textarea name="motivo_reprovacao" id="motivo_reprovacao" class="form-control" rows="5" placeholder="Descreva o motivo da reprovação..."></textarea>
            <div class="form-text">Opcional. Será adicionado às observações da cotação.</div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-danger">Reprovar Cotação</button>
            <a href="{% url 'metrologia:cotacao_detail' cotacao.id %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
