{% extends 'base.html' %}

{% block title %}Confirmar Exclusão - Item{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Confirmar Exclusão</h5>
                </div>
                <div class="card-body">
                    <p>
                        Tem certeza que deseja remover <strong>{{ item.instrumento.tag }}</strong> 
                        desta cotação?
                    </p>
                    <p><small>Valor: R$ {{ item.valor_total|floatformat:2 }}</small></p>
                </div>
                <div class="card-footer bg-light d-flex gap-2">
                    <form method="post" class="flex-grow-1">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger w-100">
                            <i class="bi bi-trash"></i> Remover
                        </button>
                    </form>
                    <a href="{% url 'metrologia:cotacao_fornecedor_itens' item.cotacao_fornecedor.id %}" 
                       class="btn btn-secondary">Cancelar</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
