{% extends 'base.html' %}

{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">
                        <i class="bi bi-exclamation-triangle"></i> Confirmar Exclusão
                    </h5>
                </div>
                <div class="card-body">
                    <p>
                        Tem certeza que deseja remover o instrumento <strong>{{ item.instrumento.tag }}</strong> 
                        desta solicitação?
                    </p>
                    <p class="text-muted">Esta ação não pode ser desfeita.</p>
                </div>
                <div class="card-footer bg-light d-flex gap-2">
                    <form method="post" class="flex-grow-1">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger w-100">
                            <i class="bi bi-trash"></i> Sim, Remover
                        </button>
                    </form>
                    <a href="{% url 'metrologia:solicitacao_detail' item.solicitacao.id %}" 
                       class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
