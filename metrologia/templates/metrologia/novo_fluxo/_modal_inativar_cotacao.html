{# Modal para inativar uma cotação obsoleta (opcionalmente já criando a nova versão com valores atualizados) #}
<div class="modal fade" id="modalInativarCotacao" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form method="post" id="formInativarCotacao" class="modal-content">
            {% csrf_token %}
            <div class="modal-header bg-warning">
                <h5 class="modal-title"><i class="bi bi-archive me-2"></i>Inativar cotação obsoleta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <p class="small mb-2">Cotação: <strong id="inativarNumero" class="font-monospace"></strong>.
                   Ela deixa de valer e sai dos totais e do planejamento, mas fica registrada para comparação.</p>
                <label class="form-label fw-bold small" for="inativarMotivo">Motivo <span class="text-danger">*</span></label>
                <input type="text" name="motivo" id="inativarMotivo" class="form-control" maxlength="255" required
                       placeholder="Ex.: valores desatualizados, escopo mudou, fornecedor reajustou...">
                <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" name="nova_versao" value="1" id="inativarNovaVersao" checked>
                    <label class="form-check-label small" for="inativarNovaVersao">
                        <strong>Criar nova versão</strong> do mesmo fornecedor, com os itens, valores e custos atuais para você
                        atualizar. O sistema compara com esta e aponta o que vale questionar.
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" name="acao" value="inativar" class="btn btn-warning btn-sm"><i class="bi bi-archive"></i> Inativar</button>
            </div>
        </form>
    </div>
</div>
<script>
function abrirInativarCotacao(cotacaoId, numero) {
    document.getElementById('formInativarCotacao').action =
        "{% url 'metrologia:cotacao_fornecedor_ativacao' 0 %}".replace('/0/', '/' + cotacaoId + '/');
    document.getElementById('inativarNumero').textContent = numero;
    document.getElementById('inativarMotivo').value = '';
    document.getElementById('inativarNovaVersao').checked = true;
    bootstrap.Modal.getOrCreateInstance(document.getElementById('modalInativarCotacao')).show();
}
</script>
