[build]
builder = "dockerfile"

# Web service (Django + Gunicorn)
[deploy]
startCommand = "python setup_persistent_storage.py && bash start.sh"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
healthcheckPath = "/healthz"
healthcheckTimeout = 100

# Persistent storage for media files (PDFs, certificates, etc)
[[services.volumes]]
mountPath = "/data/media"
name = "media_storage"

# Worker service (Celery Worker)
[[services]]
name = "worker"
startCommand = "bash start-worker.sh"
restartPolicyType = "on_failure"

# Beat service (Celery Beat)  
[[services]]
name = "beat"
startCommand = "bash start-beat.sh"
restartPolicyType = "on_failure"
